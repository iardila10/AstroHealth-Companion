# =========================================================
# Clear, astronaut-facing explanations and recommendations
# =========================================================

recommendations:
  REC_CARDIO_01:
    title: "Reduce cardiovascular strain"
    priority: 1
    message: "Your heart rate and blood pressure are elevated. Reduce physical activity and take slow, deep breaths for 5 minutes."
    actions:
      - "Stop strenuous exercise"
      - "Try 4-7-8 breathing (inhale for 4s, hold for 7s, exhale for 8s)"
      - "Drink water if possible"
      - "Contact Mission Control if symptoms do not improve within 15 minutes"

  REC_REST_01:
    title: "Rest immediately"
    priority: 1
    message: "Your body is showing signs of strain. Reduce physical and cognitive demands now."
    actions:
      - "Sit or lie down"
      - "Reduce stimulation (light, noise, screens)"
      - "Drink a small amount of water"
      - "Reassess in 20 minutes"

  REC_SLEEP_01:
    title: "Recover from sleep debt"
    priority: 1
    message: "You have slept less than recommended and your fatigue level is high. Sleep loss can significantly affect decision-making and cognitive performance."
    actions:
      - "Prioritize a sleep period of at least 90 minutes"
      - "Avoid caffeine for the next 6 hours"
      - "Use relaxation techniques before sleep"
      - "Inform the crew or Mission Control"

  REC_REST_02:
    title: "Schedule short breaks"
    priority: 2
    message: "Although your condition is not critical, the combination of insufficient sleep and fatigue calls for early action."
    actions:
      - "Take a 10-minute break every 90 minutes of work"
      - "Do gentle stretches"
      - "Review your workload with the commander"

  REC_GLUCOSE_01:
    title: "Check glucose levels"
    priority: 2
    message: "Your glucose levels are outside the target range and combined with fatigue may affect your energy and concentration."
    actions:
      - "Have a small serving of complex carbohydrates if your glucose is low"
      - "Avoid simple sugars if your glucose is high"
      - "Drink water"
      - "Repeat the measurement in 30–60 minutes"

  REC_TEMP_01:
    title: "Regulate body temperature"
    priority: 1
    message: "Your body temperature is outside the safe range. Treat this as a priority in the space environment."
    actions:
      - "Adjust the suit or cabin temperature if possible"
      - "Add or remove clothing layers"
      - "Avoid additional physical exertion"
      - "Report this to Mission Control immediately"

  REC_GENERAL_01:
    title: "Review overall health"
    priority: 3
    message: "Several indicators require attention. While none may be critical on its own, the combination increases risk."
    actions:
      - "Perform a complete vital signs check"
      - "Reduce non-essential workload"
      - "Increase monitoring frequency for the next 2 hours"
      - "Record any symptoms (dizziness, confusion, weakness)"

# Indicator explanations (used when there is a single issue)
indicator_explanations:
  heart_rate:
    yellow: "Your heart rate is outside the normal range. This may be caused by exertion, stress, or dehydration."
    red: "Your heart rate is in the critical range and requires immediate attention."
  blood_pressure_sys:
    yellow: "Your systolic blood pressure is high or low. Monitor how you feel."
    red: "Your systolic blood pressure is in a dangerous range."
  blood_pressure_dia:
    yellow: "Your diastolic blood pressure is outside the target range."
    red: "Your diastolic blood pressure is in a high-risk range."
  temperature:
    yellow: "Your body temperature is slightly outside the normal range."
    red: "Your body temperature is in the critical range (hypothermia or fever)."
  sleep_hours:
    yellow: "Your sleep duration is too short or too long, which can affect cognitive performance."
    red: "You have severe sleep debt and an increased risk of errors."
  glucose:
    yellow: "Your glucose level is outside the target range."
    red: "Your glucose is in the critical range and may affect alertness and energy."
  fatigue_level:
    yellow: "Your fatigue level is moderate. Consider reducing your workload."
    red: "Your fatigue is high, increasing the risk of errors and slower response times."