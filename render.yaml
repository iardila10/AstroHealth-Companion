databases:
  - name: astrohealth-db
    plan: free
    databaseName: astrohealth
    user: astrohealth

services:
  - type: web
    name: astrohealth-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: astrohealth-db
          property: connectionString
      - key: CORS_ORIGINS
        value: '["https://astrohealth-frontend.onrender.com"]'

  - type: web
    name: astrohealth-frontend
    runtime: static
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: astrohealth-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
